family = "infra"

[house]
platform = "infra/house"
languages = ["cxx", "python"]
licence = "MIT"

[packages.root]
path = "."
consumer_executables = ["consumer_smoke"]
[packages.root.modes]
host = "build-test-install"
firmware = "build-install"

[[packages.root.consumer_cases]]
name = "default"
tree = "host"
producer_args = ["-DPICO_BNO085_PROFILE=default"]
expect = "runs"

[[packages.root.consumer_cases]]
name = "large"
tree = "host"
producer_args = ["-DPICO_BNO085_PROFILE=large"]
consumer_args = ["-DCMAKE_CXX_FLAGS=-DEXPECT_LARGE"]
expect = "runs"

[[packages.root.consumer_cases]]
name = "pico-w-refused"
tree = "firmware"
source = "tests/consumer-board"
consumer_args = ["-DPICO_BOARD=pico_w"]
expect = "fails"
stage = "consumer-configure"
message = "PICO_BNO085 needs PICO_PLATFORM rp2350"

[ci.axes]
profile = "PICO_BNO085_PROFILE"

[[ci.require]]
group = "build"
matrix = { build_type = ["Debug", "Release"], sanitize = ["ON"], profile = ["default", "large"] }

[[ci.require]]
group = "firmware"
matrix = { board = ["pico2_w"], profile = ["default", "large"] }
prepare = ["python3 dev.py build", "python3 dev.py gate build-warnings"]

[[ci.require]]
group = "online"
schedule = "weekly"
prepare = ["python3 dev.py build --tree host", "python3 -c \"import os, subprocess; subprocess.run(['ctest', '--test-dir', 'build', '-R', 'Soak', '--no-tests=error', '--output-on-failure'], env={**os.environ, 'PICO_BNO085_SOAK_ITERATIONS': '500000'}, check=True)\""]
